services:
  rag-agent:
    build: .
    container_name: secure-rag-agent-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      PYTHONPATH: /app
    restart: unless-stopped

  # 本地模型服务：不需要时可以注释掉，config.json 里把 embedding.kind 改回 hashing 即可
  ollama:
    image: ollama/ollama:latest
    container_name: secure-rag-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - realmodel

volumes:
  ollama_data:
