name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # `python eval/xxx.py` 只会把 eval/ 加入 sys.path，找不到 src 包。
    # 这里显式把仓库根目录加进去。（脚本本身也做了自愈，这里是双保险）
    env:
      PYTHONPATH: ${{ github.workspace }}

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.11", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests (zero external dependencies)
        run: python -m unittest discover -s tests -v

      - name: Smoke - end-to-end demo
        run: python demo.py

      - name: Smoke - retrieval eval
        run: python eval/recall.py

      - name: Smoke - guardrail eval
        run: python eval/attacks.py
